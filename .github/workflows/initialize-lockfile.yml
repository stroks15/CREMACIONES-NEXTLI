name: Initialize npm lockfile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Commit package-lock.json
        run: |
          if [ -f package-lock.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: generate package-lock.json"
              git push
            else
              echo "package-lock.json already up to date"
            fi
          else
            echo "package-lock.json was not generated"
            exit 1
          fi

      - name: Start development server check
        run: |
          timeout 30s npm run dev > dev.log 2>&1 || true
          cat dev.log
